# NyaaVoiceBridge 配置文件模板

server:
  # 服务自身标识
  name: "NyaaVoiceBridge-macmini"
  log_level: "INFO"

audio:
  # Linux PipeWire 运行时配置
  xdg_runtime_dir: "/run/user/0"
  dbus_session_bus_address: "unix:path=/run/user/0/bus"
  
  # 音频节点名称 (可通过 wpctl / pw-record --target 查看)
  input_target: "bluez_input.A0_E9_DB_10_B9_D9.0"
  output_target: "bluez_output.A0_E9_DB_10_B9_D9.1"
  
  # 录音参数
  sample_rate: 16000
  channels: 1
  silence_timeout: 1.5      # 静音切片截断时间 (秒)
  max_record_duration: 30   # 单次录音最大时长 (秒)
  
  # 蓝牙自愈脚本路径
  bt_setup_script: "/usr/local/bin/bt-audio-setup.sh"

stt:
  # SenseVoice OpenAI 兼容转录端点 (按实际局域网/本地部署地址填写)
  api_base: "http://127.0.0.1:5052/v1"
  model: "SenseVoiceSmall"
  timeout: 30

astrbot:
  # OneBot V11 反向 WebSocket 服务端地址 (AstrBot 监听端口)
  # 若在宿主机访问容器内 AstrBot，填入对应网络可达地址
  ws_url: "ws://127.0.0.1:6199/ws"
  
  # 虚拟用户标识 (与 AstrBot 插件/知识库/主人画像中的 user_id 保持一致)
  user_id: 10001
  nickname: "Master"
  
  # 机器人自报标识 (对应 AstrBot 中配置的 bot QQ 号)
  self_id: 10000

# 触发与唤醒配置
trigger:
  # 模式选择:
  # wakeword: 唤醒词模式（常驻后台监听，但只有听到唤醒词才触发向 PixNyaa 提问）
  # continuous: 全量连续检测（只要听到有效人声就直接发给 PixNyaa，无唤醒词）
  # manual: 手动触发模式（不自动监听，外部调用 trigger 接口触发单次交互）
  mode: "wakeword"

  # 唤醒词列表（命中任意一个词即触发）
  wakewords:
    - "小猫同学"
    - "小猫"
    - "猫猫"
    - "喵喵"

  # 是否在发送给 PixNyaa 时自动剔除唤醒词（例如用户说“猫猫今天天气怎么样”，去除后发送“今天天气怎么样”）
  # 如果用户仅唤醒说“猫猫”，程序会自动转为日常打招呼“你好呀”
  strip_wakeword: true

